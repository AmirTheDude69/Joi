services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: joi
      POSTGRES_PASSWORD: joi
      POSTGRES_DB: joi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - joi-postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://joi:joi@postgres:5432/joi
      JOI_WEB_ORIGIN: http://localhost:3000
    ports: ["8787:8787"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      JOI_AGENT_API_URL: http://agent:8787
      JOI_AGENT_AUTH_TOKEN: ${JOI_DEV_AUTH_TOKEN:-demo-user}
    ports: ["3000:3000"]
    depends_on: [agent]

volumes:
  joi-postgres:
